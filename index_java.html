<html>
	<head>
		<meta charset="UTF-8">
		<meta name="robots" content="noindex">
		<style>
			.box {
			box-sizing: border-box;
			width:110px;
			height:110px;
			background-color:#165B33;
			float:left;
			margin-right: 10px;
			margin-bottom: 10px;
			
			}
    	</style>
	</head>
	
	<body>
		
		<div style="box-sizing: border-box; width: 600px; height: 600px; margin: 0 auto;">
			<br>
			<h1 style="text-align: center;">Lights Out</h1>
			
			<div id="b00" class="box" onclick="clk(0,0);"></div>
			<div id="b01" class="box" onclick="clk(0,1);"></div>
			<div id="b02" class="box" onclick="clk(0,2);"></div>
			<div id="b03" class="box" onclick="clk(0,3);"></div>
			<div id="b04" class="box" onclick="clk(0,4);"></div>
			<div id="b10" class="box" onclick="clk(1,0);"></div>
			<div id="b11" class="box" onclick="clk(1,1);" style="background-color: #C41E3A"></div>
			<div id="b12" class="box" onclick="clk(1,2);"></div>
			<div id="b13" class="box" onclick="clk(1,3);" style="background-color: #C41E3A"></div>
			<div id="b14" class="box" onclick="clk(1,4);"></div>
			<div id="b20" class="box" onclick="clk(2,0);"></div>
			<div id="b21" class="box" onclick="clk(2,1);"></div>
			<div id="b22" class="box" onclick="clk(2,2);"></div>
			<div id="b23" class="box" onclick="clk(2,3);"></div>
			<div id="b24" class="box" onclick="clk(2,4);"></div>
			<div id="b30" class="box" onclick="clk(3,0);"></div>
			<div id="b31" class="box" onclick="clk(3,1);" style="background-color: #C41E3A"></div>
			<div id="b32" class="box" onclick="clk(3,2);"></div>
			<div id="b33" class="box" onclick="clk(3,3);" style="background-color: #C41E3A"></div>
			<div id="b34" class="box" onclick="clk(3,4);"></div>
			<div id="b40" class="box" onclick="clk(4,0);"></div>
			<div id="b41" class="box" onclick="clk(4,1);"></div>
			<div id="b42" class="box" onclick="clk(4,2);"></div>
			<div id="b43" class="box" onclick="clk(4,3);"></div>
			<div id="b44" class="box" onclick="clk(4,4);"></div>
		</div>
		
		<script>
			function clk(y,x){
				toggleColor(y, x);
				
				toggleColor(y - 1, x);
				toggleColor(y + 1, x);
				
				toggleColor(y, x - 1);
				toggleColor(y, x + 1);
			}
				
			function toggleColor(y, x) {
				if (y >= 0 && y <= 4 && x >= 0 && x <= 4) {
					var id="b"+ y + x;
					var el = document.getElementById(id);
				
					if (el) {
						if (el.style.backgroundColor === "#C41E3A" || el.style.backgroundColor === "rgb(196, 30, 58)") {
						el.style.backgroundColor = "#165B33";
						} else {
						el.style.backgroundColor = "#C41E3A";
						}
					}
				}
			}
		</script>
		
	</body>
</html>
